appId: com.doodledesktopconfig.app
productName: Mesh Rider Configurator
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# electron-vite externalises runtime dependencies, so `ssh2` is loaded from node_modules at
# runtime rather than bundled. electron-builder picks up everything in "dependencies"
# automatically; the globs below only need to cover our own build output.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'

asar: true

# Ad-hoc signs the macOS bundle so Apple Silicon will actually execute it. No-op on
# Windows and Linux, and skipped when a real signing certificate is configured.
afterPack: build/afterPack.cjs

# There are no native modules — ssh2's optional cpu-features/nan bindings are not installed, so
# it runs in pure-JS mode. Skipping the rebuild step avoids needing MSVC toolchain on the builder.
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Shown in the file properties dialog and in SmartScreen prompts.
  legalTrademarks: ''

nsis:
  # A wizard rather than a silent one-click install, so the user can pick a location.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mesh Rider Configurator
  uninstallDisplayName: Mesh Rider Configurator
  # Keep the radio inventory and saved scripts across an uninstall/reinstall cycle.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-${version}-Setup.${ext}

portable:
  artifactName: ${productName}-${version}-Portable.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  # Build both slices explicitly. Without this, electron-builder targets only the build
  # machine's own architecture — and GitHub's macos-latest runners are Apple Silicon, so
  # the result would silently refuse to launch on any Intel Mac.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  minimumSystemVersion: '11.0'
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # macOS 15 (Sequoia) gates access to LAN devices behind an explicit permission prompt.
    # Radios live on the local network, so without this key the app is denied silently and
    # every radio simply appears offline. The string is what the system prompt shows.
    NSLocalNetworkUsageDescription: >-
      Mesh Rider Configurator needs local network access to discover and configure
      Doodle Labs radios on your network.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Standard drag-to-install layout.
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage, deb]
  maintainer: jus24194971
  desktop:
    Name: Mesh Rider Configurator
    Comment: Configure and monitor Doodle Labs Mesh Rider radios
