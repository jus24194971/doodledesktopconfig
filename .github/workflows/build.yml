name: Build installers

# Push a tag like v0.1.0 to produce installers for all three platforms and attach them to a
# GitHub Release. Also runnable on demand from the Actions tab, and on pushes to main as a
# compile check.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows
          - os: macos-latest
            platform: mac
            artifact: macos
          - os: ubuntu-latest
            platform: linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        run: npm run pack:${{ matrix.platform }}
        env:
          # Nothing is code-signed; without this electron-builder tries to discover a macOS
          # identity and fails the job on unsigned runners.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # These Info.plist keys are load-bearing and easy to lose in a config edit:
      # without NSLocalNetworkUsageDescription, macOS 15 denies LAN access silently and
      # every radio reads as offline. Fail the build rather than ship that.
      - name: Verify macOS bundle metadata
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then echo "::error::no .app bundle produced"; exit 1; fi

          for app in "${apps[@]}"; do
            plist="$app/Contents/Info.plist"
            echo "=== $app"
            for key in NSLocalNetworkUsageDescription LSMinimumSystemVersion CFBundleIdentifier CFBundleShortVersionString; do
              if value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null); then
                echo "    $key = $value"
              else
                echo "::error::$app is missing Info.plist key $key"
                fail=1
              fi
            done
            # Confirm the icon actually landed, rather than silently falling back to Electron's.
            if [ ! -f "$app/Contents/Resources/icon.icns" ]; then
              echo "::error::$app is missing Resources/icon.icns"
              fail=1
            fi
            echo "    arch = $(lipo -archs "$app/Contents/MacOS/Mesh Rider Configurator" 2>/dev/null || echo unknown)"

            # Apple Silicon refuses to exec an unsigned arm64 binary, so an unsigned bundle is
            # not merely "untrusted" — it cannot start at all. Ad-hoc is enough to run; this
            # check exists because the failure mode ("app is damaged") points nowhere near the
            # real cause.
            if codesign --verify --deep --strict "$app" 2>/dev/null; then
              authority=$(codesign -dv "$app" 2>&1 | grep -E '^(Authority|Signature)' | head -1)
              echo "    signature = valid  ${authority:-(ad-hoc)}"
            else
              echo "::error::$app has no valid code signature — it will not launch on Apple Silicon"
              fail=1
            fi
          done
          exit $fail

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    # Only publish when a version tag was pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
